# EXAMPLE ONLY, with fake placeholder values. It is not loaded by the application.
#
# The real configuration is backend/src/main/resources/application.yml, which reads every credential from ENVIRONMENT
# VARIABLES (nothing secret is committed). To override settings locally without environment variables, copy this file to
# backend/src/main/resources/application-local.properties (git-ignored) and start with: SPRING_PROFILES_ACTIVE=local
# Never commit real values.

spring.datasource.url=jdbc:postgresql://localhost:5432/loanlens_db
spring.datasource.username=postgres
spring.datasource.password=change-me

loanlens.seed.enabled=false
loanlens.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# AI explanations (leave api-key empty to run with the labelled deterministic fallback)
loanlens.ai.provider=anthropic
loanlens.ai.model=claude-sonnet-5-5
loanlens.ai.api-key=
loanlens.ai.timeout-seconds=30
