spring:
  application:
    name: loanlens-backend

  # Credentials come from the environment. Nothing secret is committed.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loanlens_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false            # no lazy loading in controllers; services return DTOs
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks the mapping matches it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always
    generator:
      write-bigdecimal-as-plain: true      # 62000.00, never 6.2E+4
    deserialization:
      fail-on-unknown-properties: true      # a typo in a request field is an error, not silently ignored
    serialization:
      write-dates-as-timestamps: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: LoanLens backend
    description: Educational loan profitability analyzer (simplified model, not a production banking system)

loanlens:
  cors:
    # Comma-separated origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  seed:
    # Loads the 13 sample loans from the frontend demo (fictitious data). Off by default.
    enabled: ${LOANLENS_SEED_ENABLED:false}
  ai:
    # AI explanations (POST /api/ai/explain). All values come from the environment; the key is NEVER committed.
    # With no AI_API_KEY the endpoint still works and answers with the deterministic backend explanation (labelled FALLBACK).
    provider: ${AI_PROVIDER:anthropic}            # anthropic | none
    model: ${AI_MODEL:claude-sonnet-5-5}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}                      # optional override (tests / proxy); blank = provider default
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4000}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}
    max-request-bytes: ${AI_MAX_REQUEST_BYTES:8192}

logging:
  level:
    root: INFO
    com.loanlens: INFO
